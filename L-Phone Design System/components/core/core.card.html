<!DOCTYPE html>
<html lang="en">
<head>

<style>

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, IconButton, Avatar, StatusDot, Badge, Card } = window.LPhoneDesignSystem_5e292e;
  function Demo() {
    return (
      <React.Fragment>
        <div className="row">
          <span className="lbl">Button</span>
          <Button variant="accent">Сохранить</Button>
          <Button variant="standard">Отмена</Button>
          <Button variant="standard" icon="phone">Позвонить</Button>
          <Button variant="subtle">Меню</Button>
          <Button variant="destructive">Удалить</Button>
          <Button variant="standard" size="sm">sm</Button>
          <Button variant="accent" disabled>Disabled</Button>
        </div>
        <div className="row">
          <span className="lbl">IconButton</span>
          <div className="navy-strip">
            <IconButton variant="accept" size={56} icon="phone" title="Call" />
            <IconButton variant="glass" icon="microphone" title="Mute" />
            <IconButton variant="glass" icon="pause" title="Hold" />
            <IconButton variant="glass" icon="video" title="Video" />
            <IconButton variant="end" icon="decline-call" title="Hang up" />

          <IconButton variant="subtle" size={36} icon="settings" title="Settings" />

        </div>
        <div className="row">

          <Avatar initials="ИП" size={40} tone="slate" status="online" ringColor="#f9f9f9" />
          <Avatar initials="АК" size={40} tone="navy" />
          <Avatar initials="С" size={40} tone="accent" />
          <StatusDot status="online" label="Подключён" />
          <StatusDot status="offline" label="Не подключён" />

          <Badge tone="navy">TLS</Badge>
