<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  #root { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; align-items: start; max-width: 600px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { TextField, Select, ToggleSwitch, SearchBox } = window.LPhoneDesignSystem_5e292e;
  function Demo() {
    return (
      <div className="grid">
        <TextField label="Имя сервера" defaultValue="sip.example.com" />
        <Select label="Транспорт" defaultValue="tls" options={[
          { value: "udp", label: "UDP" },
          { value: "tcp", label: "TCP" },
          { value: "tls", label: "TLS" },
        ]} />
        <TextField label="Логин" placeholder="1001" hint="Внутренний номер" />
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <ToggleSwitch label="Эхоподавитель" defaultChecked />
          <ToggleSwitch label="Использовать ICE" />
        </div>
        <div style={{ gridColumn: "1 / -1" }}>
          <SearchBox placeholder="Поиск по имени или номеру" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
