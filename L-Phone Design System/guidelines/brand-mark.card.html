<!-- @dsCard group="Brand" viewport="700x170" name="App Mark & Wordmark" subtitle="The L-Phone identity: a single 'L' on navy. Square app icon + round tray badge." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); color: var(--text-primary); }
  .wrap { padding: 24px 28px; display: flex; align-items: center; gap: 34px; }
  .mark { background: var(--surface-brand); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: var(--fw-semibold); }
  .square { width: 72px; height: 72px; border-radius: 16px; font-size: 44px; }
  .round { width: 48px; height: 48px; border-radius: var(--radius-round); font-size: 26px; }
  .lock { display: flex; flex-direction: column; gap: 4px; }
  .wordmark { font-family: var(--font-display); font-size: 30px; font-weight: var(--fw-semibold); letter-spacing: -0.01em; }
  .wordmark b { color: var(--surface-brand); }
  .tag { font-size: 12px; color: var(--text-secondary); }
  .swet { margin-left: auto; font-size: 11px; font-family: var(--font-mono); color: var(--text-tertiary); text-align: right; line-height: 1.7; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark square">L</div>
    <div class="mark round">L</div>
    <div class="lock">
      <div class="wordmark"><b>L</b>‑Phone</div>
      <div class="tag">SIP softphone · built on liblinphone</div>
    </div>
    <div class="swet">surface #22334D<br />glyph #FFFFFF<br />radius 16 / round</div>
  </div>
</body>
</html>
