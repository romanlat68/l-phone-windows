<!-- @dsCard group="Type" viewport="700x130" name="Monospace — Cascadia / Consolas" subtitle="Diagnostic logs, SIP traces & technical values." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-card); color: var(--text-primary); }
  .wrap { padding: 18px 22px; }
  pre { margin: 0; font: var(--fw-regular) 12px / 18px var(--font-mono); color: var(--text-secondary); background: var(--surface-page); border: 1px solid var(--stroke-card); border-radius: var(--radius-sm); padding: 12px 14px; white-space: pre-wrap; }
  .k { color: var(--text-accent); }
  .g { color: var(--state-success); }
</style>
</head>
<body>
  <div class="wrap">
    <pre><span class="g">[ok]</span> liblinphone 5.3.0 — Core запущен
<span class="k">Звонок:</span> StreamsRunning  ← sip:1001@sip.example.com
<span class="k">Регистрация:</span> Ok  expires=3600  transport=tls</pre>
  </div>
</body>
</html>
